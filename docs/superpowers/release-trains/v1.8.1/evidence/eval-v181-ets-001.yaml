results:
  contract_validation: passed        # 32 assertions green; 2 findings tracked below
  known_truth: pending_lane          # oracle self-checks green; pack recovery xfailed (Model Pack absent)
  fault_injection: pending_lane      # fault-case self-checks green; pack verdicts xfailed (Model Pack absent)
  overclaim_checks: passed           # volatility/VaR + cross-family-IC scanners proven against counterexamples
  self_reference_checks: passed      # batch checker proven; producer-bound variant xfailed (Agent absent)
  browser_e2e: not_applicable        # UI lane absent; no browser path exists to evaluate at this commit
  findings:
    - id: F-1
      severity: blocker
      status: filed_and_repaired_on_integration
      subject: tests/fixtures/contracts/v181/ets_result.json
      claim: >
        The canonical ETS result fixture carries aic=12043.72, log_likelihood=-6015.86,
        n_obs=2610, bic=12078.11. AIC implies exactly k=(aic+2*llf)/2=6; with k=6 the
        coherent bic is -2*llf+6*ln(2610)=12078.92. The published bic implies k=5.897,
        which is not an integer, so AIC and BIC cannot come from one likelihood and one k.
      why_it_matters: >
        This is the fixture every lane mocks against (ADR §5.4); an incoherent canonical
        packet teaches three lanes to accept a composite information criterion — exactly
        what the v1.8.0 ledger already refuses.
      reproduce: "pytest tests/evaluation/v181/test_contract_validation.py::test_canonical_ets_fixture_information_criteria_are_arithmetically_consistent"
      baseline_at_this_commit: xfailed   # defect still present in evaluated_commit
      attribution: Integration (Contract Sprint) — fixture is integration-owned; this lane does not edit it (ADR §7D)
    - id: F-2
      severity: blocker
      status: filed_and_repaired_on_integration
      subject: backend/workbench/contracts/agent/notebook_option.py (NotebookOptionRevision.from_dict)
      claim: >
        Unlike ETSResultContract.from_dict and OptionExecution.from_dict (both call
        require_exact_keys), NotebookOptionRevision.from_dict reads named keys off the
        payload and silently drops all others, so an unversioned extra field validates
        and then vanishes on round-trip.
      why_it_matters: >
        The precise anti-pattern ADR §11 names — "在 payload 偷塞未版本化字段". A lane can ship
        a field, the packet still validates, the field disappears, and nothing notices.
      reproduce: "pytest tests/evaluation/v181/test_contract_validation.py::test_notebook_option_revision_rejects_unknown_fields"
      baseline_at_this_commit: xfailed   # defect still present in evaluated_commit
      attribution: Integration (Contract Sprint) — contract is integration-owned; this lane does not edit it (ADR §7D)

