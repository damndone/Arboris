tests:
  focused_contract_lock:
    command: "cd backend && PYTHONPATH=$PWD ../.venv/bin/python -m pytest ../tests/contracts/test_v189_contract_lock.py -q"
    observed_result: "157 passed in 1.60s"
    status: PASSED
    scope: serialization, semver, canonical digest, compatibility, provider catalog, authority boundaries, security and property-like mutation/injection coverage
  retained_existing_contract_and_registry:
    command: "PYTHONPATH=$PWD/backend .venv/bin/python -m pytest tests/contracts/test_v181_contract_lock.py tests/contracts/test_v183_contract_lock.py tests/test_workflow_contracts_v186.py tests/test_workflow_capability_registry.py -q"
    observed_result: "137 passed in 10.43s"
    status: PASSED
    scope: retained pre-v1.8.9 contract and live workflow registry compatibility
  repository_checks:
    - command: git diff --check
      observed_result: exit 0
      status: PASSED
    - command: "PYTHONPATH=$PWD/backend .venv/bin/python -m compileall -q backend/workbench/contracts backend/workbench/providers"
      observed_result: exit 0
      status: PASSED
    - command: "ruby -e 'require \"yaml\"; YAML.safe_load(File.read(\"docs/superpowers/release-trains/v1.8.9/contract-lock-manifest.yaml\"), aliases: false)'"
      observed_result: exit 0
      status: PASSED
    - command: "Markdown structural check: git diff --check plus final newline check on the two Task6 Markdown/YAML files"
      observed_result: PASSED
      status: PASSED

compatibility:
  producer_consumer_matrix: current, old_minor, unknown_major, missing_field, unknown_field, digest_mismatch, duplicate_provider, corrupt_state, blocked_evidence, not_applicable_projection
  stable_fail_closed_reason_codes: true
  implicit_version_coercion: forbidden
  live_operation_registry_equivalence: "asserted by focused tests before and after builtin catalog load"

security_boundary:
  fail_closed_inputs: [wire_input, manifest_input, provider_input, llm_input, ordinary_module_mutation, ordinary_instance_mutation, ordinary_index_mutation]
  covered_by: tests/contracts/test_v189_contract_lock.py
  accepted_outside_scope: arbitrary trusted-code function __closure__ monkeypatch
  outside_scope_reason: pure-Python Contract-only tests cannot establish a process or external authority boundary for arbitrary trusted-code closure mutation

scope_boundary:
  changed_by_task6:
    - docs/superpowers/release-trains/v1.8.9/contract-lock-manifest.yaml
    - docs/superpowers/handoff/2026-08-15-v1.8.9-contract-lock-handoff.md
    - formal events and RETROSPECTIVE.md generated only through scripts/devline_control.py
  intentionally_untouched:
    - runtime
    - orchestrator
    - Notebook
    - Graph
    - frontend
    - feature_gate
    - provider_live_registry
    - scripts/gate.sh
    - statistical implementations

acceptance_status:
