contract_lock_semantics: >-
  The C1.1 code commit is the immutable contract lock and the only permitted
  branch start for this wave. Receipt commits are docs-only governance evidence
  and must never be used as a Feature or Evaluation Lane ancestor.
receipt_binding_semantics: >-
  R1 is the docs-only receipt payload. R2, a direct child of R1, adds the R1
  SHA as receipt_commit to this manifest and each Work Order. That reference
  does not change contract_lock_commit or branch_start_commit.
contract_versions:
  packet_envelope: "1.0"
  linear_mixed_effects: "1.0"
  repeated_measures_agent: "1.0"
  model_options_owner_binding: "1.0"
owner_binding_contract:
  storage: >-
    Non-empty model_options remain a model-owned flat payload. The server writes
    a sibling model_options_binding with owner_model_type, owner_model_id,
    producer_version, input_contract_version, and normalized_options_hash.
  server_authority: >-
    Clients may submit model_type and payload only. Binding facts are generated
    from the resolved handler and any client-supplied binding is rejected or
    overwritten at the submit boundary.
  same_identity: >-
    Only matching owner_model_type, owner_model_id, producer_version, and input
    contract version allow a one-level source payload merge; hash is verified
    before that source payload is read.
  identity_change: >-
    A public model_type, resolved model_id, or producer/input-contract change
    requires an explicit complete target replacement. That path never reads or
    inherits source model_options payload.
  empty_options: >-
    Empty options keep v1.7.2 behavior and carry no binding. A cross-model clear
    is explicit with model_options: {}.
  secret_key_policy: >-
    Generic model_options reject nested keys matched by the run_inputs secret
    redaction policy. This prevents redaction from changing a persisted payload
    after its canonical hash is computed; it is an audit-consistency guard, not
    a cryptographic signature claim.
audit_chain:
  required_surfaces:
    - form.model_options_binding
    - executable_payload.model_options_binding
    - confirmed_payload.model_options_binding
    - executed_payload.model_options_binding on successful bound handlers
  draft_rule: >-
    Pipeline Draft inputs reject model_options_binding. Genesis and rerun-child
    snapshots use only the resolved server-owned binding.
