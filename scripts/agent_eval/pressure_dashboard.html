<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arboris · 本地压力测试</title>
<style>
:root{color-scheme:light dark;font:15px/1.5 system-ui;background:#eef2f8;color:#18253b}
body{max-width:1100px;margin:0 auto;padding:36px 22px}
h1{font-size:30px;margin:4px 0}.lead{color:#53657e;margin:0 0 22px}.overline{font-size:13px;color:#305785;letter-spacing:.07em}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.metric,section{background:#fff;border:1px solid #d8e1ee;border-radius:12px;padding:14px 16px}
.metric strong{display:block;font-size:23px}.muted,small{color:#576882}
section{margin-top:16px}h2{font-size:18px;margin:0 0 10px}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th,td{text-align:left;border-bottom:1px solid #dce5f1;padding:9px 7px;overflow-wrap:anywhere}
th:first-child{width:27%}th:nth-child(2){width:17%}th:nth-child(3){width:14%}
tbody tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;background:#ecf1fa;color:#27518b}
.completed{background:#dbf4e5;color:#14543a}.capacity,.expected_error{background:#fff1cf;color:#744700}
.error,.failed,.blocked,.interrupted{background:#fce2e2;color:#8a2432}.running{background:#deebff;color:#144a97}
a{color:#1854a1}.alert{color:#9a2334;font-weight:600}.wrap{overflow:auto}
@media(prefers-color-scheme:dark){:root{background:#101829;color:#e1e9f5}.lead,.muted,small{color:#a4b6d2}
.overline,a{color:#a1c6ff}.metric,section{background:#192539;border-color:#35445b}td,th{border-color:#35445b}.alert{color:#ff9eaa}}
</style>
</head>
<body>
<header><div class="overline">ARBORIS 1.9.1 · M5 准备</div><h1>本地压力测试</h1>
<p class="lead">合成数据与严格录制回放。正式模型评测尚未启动。</p></header>
<div class="metrics" aria-label="运行指标">
<div class="metric"><small>阶段</small><strong id="phase">连接中</strong></div>
<div class="metric"><small>RSS 合计采样峰值</small><strong id="peak">—</strong></div>
<div class="metric"><small>预期拒绝</small><strong id="expected">—</strong></div>
<div class="metric"><small>意外失败</small><strong id="unexpected">—</strong></div>
</div>
<p class="muted" id="updated" role="status"></p><p class="alert" id="error"></p>
<section class="wrap"><h2>任务与原因</h2>
<table><thead><tr><th scope="col">任务</th><th scope="col">状态</th><th scope="col">HTTP / 耗时</th><th scope="col">原因 / 证据</th></tr></thead>
<tbody id="tasks"></tbody></table></section>
<section><h2>内存采样</h2><p id="rss" class="muted">等待采样</p>
<small>统计观察器、Workbench 服务及已登记的回放进程和子进程。共享页可能重复计入，各进程的采样峰值留在本地记录。</small></section>
<script>
const names = {waiting:"等待", running:"运行中", completed:"已通过", capacity:"容量拒绝", expected_error:"预期失败",
  failed:"失败", blocked:"被阻止", error:"失败", cancelled:"取消", interrupted:"中断"};
const $ = id => document.getElementById(id);
function cell(row, text) { const td = row.insertCell(); td.textContent = text; return td; }
async function refresh() {
  try {
    const response = await fetch("/status.json", {cache:"no-store"});
    if (!response.ok) throw new Error("读取失败");
    const s = await response.json();
    $("phase").textContent = s.phase;
    $("peak").textContent = `${(s.peak_rss_kib / 1024).toFixed(1)} MiB`;
    $("expected").textContent = s.tasks.filter(t => ["capacity","expected_error"].includes(t.status)).length;
    $("unexpected").textContent = s.tasks.filter(t => ["error","failed","blocked","cancelled","interrupted"].includes(t.status)).length;
    const stale = s.result === null && Date.now() - Date.parse(s.updated) > 5000;
    $("updated").textContent = `${stale ? "采样心跳已停止 · " : ""}更新于 ${new Date(s.updated).toLocaleTimeString()} · 内存停止门 ${s.rss_limit_mib} MiB`;
    $("error").textContent = s.error || "";
    const rows = document.createDocumentFragment();
    for (const t of s.tasks) {
      const tr = document.createElement("tr");
      cell(tr, t.name);
      const badge = document.createElement("span");
      badge.className = `badge ${t.status}`;
      badge.textContent = names[t.status] || t.status;
      cell(tr, "").append(badge);
      cell(tr, [t.http, t.elapsed_s === undefined ? null : t.elapsed_s.toFixed(2) + " s"].filter(Boolean).join(" · ") || "—");
      const evidence = cell(tr, t.detail || "—");
      if (t.url) {
        const a = document.createElement("a");
        a.href = t.url; a.textContent = "打开 Workbench"; a.target = "_blank"; a.rel = "noopener";
        evidence.append(document.createElement("br"), a);
      }
      rows.append(tr);
    }
    $("tasks").replaceChildren(rows);
    $("rss").textContent = Object.entries(s.rss_kib).map(([pid, value]) =>
      `PID ${pid}  ${(value / 1024).toFixed(1)} MiB`).join("　·　") || "等待采样";
  } catch {
    $("updated").textContent = "监控连接暂不可用。已显示的数据是最后一次收到的快照。";
  } finally {
    setTimeout(refresh, 1100);
  }
}
refresh();
</script>
</body>
</html>
