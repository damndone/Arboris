[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-econometrics-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "filelock>=3.13",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyarrow>=16.0",
  "pyreadstat>=1.2",
  "statsmodels>=0.14",
  "arch==8.0.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "reportlab>=4.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jsonschema>=4.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "jsonschema>=4.0"]
panel = ["linearmodels>=6"]
ml = ["scikit-learn>=1.5"]
imbalanced = ["imbalanced-learn>=0.12"]
imputation = ["statsmodels>=0.14"]

[project.scripts]
workbench = "workbench.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
# tmp_path is scratch: evidence worth keeping is written to tests/fixtures or,
# through tests/evidence_retention.py, to the ignored local/test-evidence (also
# the last 3 runs per category, failed runs always kept). Keep the last 3
# sessions, and in them only the directories of failed tests (user decision,
# 2026-10-07).
tmp_path_retention_count = 3
tmp_path_retention_policy = "failed"
